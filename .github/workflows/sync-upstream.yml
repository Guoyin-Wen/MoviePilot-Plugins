name: Sync Upstream

# 自动同步上游 jxxghp/MoviePilot-Plugins 的更新到本 fork。
# 策略：fetch upstream -> 尝试 merge。
#   - 干净 merge：自动 push 到 main；
#   - 有冲突：开/刷新 sync-upstream PR，在 GitHub UI 手动解决冲突后合并。

on:
  schedule:
    # UTC 16:17 ≈ 北京时间 00:17，每天一次
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jxxghp/MoviePilot-Plugins.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date, nothing to sync."
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits."
          fi

      - name: Merge or open sync PR
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if git merge upstream/main --no-edit; then
            echo "✅ Clean merge — pushing to main."
            git push origin main
            echo "::notice::Synced upstream to main successfully."
            exit 0
          fi

          echo "⚠️ Merge conflicts — opening a PR for manual resolution."
          git merge --abort

          SYNC_BRANCH="sync-upstream"
          # 让 PR 的 head 即为上游最新快照，base 为 main，由 GitHub 标注冲突
          git checkout -B "$SYNC_BRANCH" upstream/main
          git push --force origin "$SYNC_BRANCH"

          existing_pr="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number -q '.[0].number // empty' 2>/dev/null || true)"

          printf '%s\n' \
            '## ⬆️ 同步上游 jxxghp/MoviePilot-Plugins' \
            '' \
            '此 PR 由 `Sync Upstream` workflow 自动创建/刷新，用于把上游更新合入 `main`。' \
            '' \
            '- 含有**需要手动解决冲突**的文件（常见于 `package.v2.json`、`iyuuautoseed`、`traktcleaner` 等双方都改过的地方）。' \
            '- 请在 GitHub 的 *Resolve conflicts* 界面处理后再合并。' \
            '- 合并后下一次定时检查将回到「干净自动同步」状态。' \
            > /tmp/pr-body.md

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body-file /tmp/pr-body.md
            gh pr comment "$existing_pr" --body "🔄 上游有新更新，冲突已刷新，请重新解决后合并。"
            echo "::notice::Refreshed existing sync PR #$existing_pr."
          else
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "⬆️ 同步上游 jxxghp/MoviePilot-Plugins" \
              --body-file /tmp/pr-body.md
            echo "::notice::Created new sync PR for conflict resolution."
          fi
